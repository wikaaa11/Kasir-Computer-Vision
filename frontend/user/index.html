
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ngolab - computer-vision</title>
    <link rel="icon" type="image/png" href="https://storage.googleapis.com/static-content-ais/7468da51-901f-4e72-b610-8daa5e2ea01a/input_file_0.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #F8FAFC;
        margin: 0;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }
      .vision-shadow {
        box-shadow: 0 20px 50px -12px rgba(249, 115, 22, 0.2);
      }
      .scan-line {
        height: 2px;
        background: linear-gradient(90deg, transparent, #F97316, transparent);
        animation: scan 2s linear infinite;
        position: absolute;
        width: 100%;
        top: 0;
      }
      @keyframes scan {
        0% { top: 0; }
        100% { top: 100%; }
      }

      /* html5-qrcode overrides */
      #qr-reader {
        width: 100% !important;
        height: 100% !important;
      }
      #qr-reader video {
        width: 100% !important;
        height: 100% !important;
        object-fit: cover !important;
        border-radius: 20px !important;
      }
      #qr-reader__dashboard {
        display: none !important;
      }

      /* Floating card animations */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes floatMedium {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      .animate-float-slow  { animation: floatSlow  4s ease-in-out infinite; }
      .animate-float-medium { animation: floatMedium 3s ease-in-out infinite 0.5s; }
      .animate-float-fast  { animation: floatFast  2.5s ease-in-out infinite 1s; }

      /* Fade-in helper */
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .fade-in-up { animation: fadeInUp 0.6s ease-out both; }
    </style>
